<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Pocket Money</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f7fafc; margin: 0; padding: 16px; color: #2d3748; }
    .container { max-width: 480px; margin: 0 auto; }
    .card { background: white; border-radius: 16px; padding: 22px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
    .balance-val { font-size: 3.2rem; font-weight: 800; color: #38a169; margin: 4px 0; text-align: center; }
    .subtitle { text-align: center; color: #a0aec0; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; }
    h3 { margin-top: 0; font-size: 1.15rem; color: #2b6cb0; }
    
    .form-group { margin-bottom: 12px; text-align: left; }
    label { display: block; font-size: 0.85rem; font-weight: 700; color: #4a5568; margin-bottom: 6px; }
    input, select { width: 100%; padding: 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 1rem; }
    
    button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; color: white; }
    .btn-green { background: #38a169; }
    .btn-blue { background: #3182ce; }
    .btn-gray { background: #718096; margin-top: 8px; }

    /* Timeframe Slicer Chips */
    .slicer-chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; justify-content: center; }
    .slicer { background: #edf2f7; border: 1px solid #cbd5e0; color: #4a5568; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; width: auto; }
    .slicer.active { background: #2b6cb0; color: white; border-color: #2b6cb0; }

    /* Kid Analytics Grid */
    .kid-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .kid-stat-box { background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; text-align: center; }
    .kid-stat-title { font-size: 0.72rem; font-weight: 700; color: #718096; text-transform: uppercase; }
    .kid-stat-val { font-size: 1.35rem; font-weight: 800; margin: 4px 0 0; }
    
    /* Transaction Filter Chips */
    .filter-chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
    .chip { background: #edf2f7; border: none; color: #4a5568; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; width: auto; white-space: nowrap; }
    .chip.active { background: #3182ce; color: white; }

    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 10px 4px; text-align: left; border-bottom: 1px solid #edf2f7; vertical-align: middle; }
    .pos { color: #38a169; font-weight: 700; }
    .neg { color: #e53e3e; font-weight: 700; }
    .type-badge { font-size: 0.72rem; padding: 2px 6px; border-radius: 6px; font-weight: 700; text-transform: uppercase; margin-right: 4px; display: inline-block; }
    .type-chore { background: #ebf8ff; color: #2b6cb0; }
    .type-reward { background: #e6fffa; color: #234e52; }
    .type-penalty { background: #fff5f5; color: #9b2c2c; }
    .type-allowance { background: #faf5ff; color: #6b46c1; }
    .type-expense { background: #edf2f7; color: #4a5568; }

    .denied-banner { background: #fff5f5; border: 1px solid #feb2b2; border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">

    <!-- LOGIN SCREEN -->
    <div class="card" id="loginCard">
      <h2 style="margin-top:0; text-align:center; color:#2b6cb0;">Kid Sign In</h2>
      <div class="form-group">
        <label for="childNameSelect">Who is saving today?</label>
        <select id="childNameSelect"><option value="">Loading names...</option></select>
      </div>
      <div class="form-group">
        <label for="pinInput">Enter 4-Digit PIN</label>
        <input type="password" id="pinInput" placeholder="••••" maxlength="6" style="text-align:center; letter-spacing:4px; font-size:1.4rem;">
      </div>
      <button class="btn-blue" onclick="attemptLogin()">Unlock My Savings</button>
    </div>

    <!-- AUTHENTICATED DASHBOARD -->
    <div id="dashboard" style="display: none;">
      
      <!-- Balance Card -->
      <div class="card">
        <div class="subtitle" id="childGreeting">Total Savings</div>
        <div class="balance-val" id="balanceDisplay">Rs. 0</div>
      </div>

      <!-- Denied Chores Note -->
      <div class="denied-banner" id="deniedSection" style="display: none;">
        <strong style="color: #c53030;">Note on recent chores:</strong>
        <div id="deniedList"></div>
      </div>

      <!-- Kid Analytics Card -->
      <div class="card" style="padding-bottom: 14px;">
        <div class="slicer-chips">
          <button class="slicer active" onclick="setChildTimeframe(this, 'ALL')">All Time</button>
          <button class="slicer" onclick="setChildTimeframe(this, 'WEEK')">This Week</button>
          <button class="slicer" onclick="setChildTimeframe(this, 'MONTH')">This Month</button>
          <button class="slicer" onclick="setChildTimeframe(this, 'YEAR')">This Year</button>
        </div>

        <div class="kid-stats-grid">
          <div class="kid-stat-box" style="border-top: 3px solid #2b6cb0;">
            <div class="kid-stat-title">Chores Earned</div>
            <div class="kid-stat-val" id="kidChoreStat" style="color:#2b6cb0;">Rs. 0</div>
          </div>
          <div class="kid-stat-box" style="border-top: 3px solid #38a169;">
            <div class="kid-stat-title">Rewards / Bonuses</div>
            <div class="kid-stat-val" id="kidRewardStat" style="color:#38a169;">Rs. 0</div>
          </div>
          <div class="kid-stat-box" style="border-top: 3px solid #e53e3e;">
            <div class="kid-stat-title">Penalties</div>
            <div class="kid-stat-val" id="kidPenaltyStat" style="color:#e53e3e;">Rs. 0</div>
          </div>
          <div class="kid-stat-box" style="border-top: 3px solid #718096;">
            <div class="kid-stat-title">Money Spent</div>
            <div class="kid-stat-val" id="kidSpentStat" style="color:#4a5568;">Rs. 0</div>
          </div>
        </div>
      </div>

      <!-- Claim Finished Chore -->
      <div class="card">
        <h3>I Finished a Chore!</h3>
        <div class="form-group">
          <label for="choreSelect">Choose Chore</label>
          <select id="choreSelect"><option>Loading...</option></select>
        </div>
        <button class="btn-green" onclick="claimChore()">Ask Parents to Check</button>
      </div>

      <!-- Log Expense -->
      <div class="card">
        <h3>I Spent Money</h3>
        <div class="form-group">
          <label for="spendAmt">Amount Spent (<span class="currencySymbol">Rs. </span>)</label>
          <input type="number" id="spendAmt" placeholder="e.g. 100">
        </div>
        <div class="form-group">
          <label for="spendDesc">What did you buy?</label>
          <input type="text" id="spendDesc" placeholder="e.g. Book, treats">
        </div>
        <button class="btn-blue" onclick="logSpending()">Subtract from Savings</button>
      </div>

      <!-- Transactions Ledger with Filter Bar -->
      <div class="card">
        <h3>Past Transactions</h3>
        
        <div class="filter-chips">
          <button class="chip active" onclick="setTxFilter(this, 'ALL')">All</button>
          <button class="chip" onclick="setTxFilter(this, 'Chore')">Chores</button>
          <button class="chip" onclick="setTxFilter(this, 'Reward')">Rewards</button>
          <button class="chip" onclick="setTxFilter(this, 'Penalty')">Penalties</button>
          <button class="chip" onclick="setTxFilter(this, 'Expense')">Spending</button>
        </div>

        <table>
          <thead>
            <tr><th>Activity</th><th style="text-align:right;">Amount</th></tr>
          </thead>
          <tbody id="txBody"></tbody>
        </table>
        <button class="btn-gray" onclick="logout()">Lock Screen</button>
      </div>

    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9XQECAp7VLwD0Pw2AiKC553q-W7t2RsOvBqrbdyDDu4WxZO5hSphCFMJE2K4oyls/exec";

    let activeCurrency = "Rs. ";
    let rawHistory = [];
    let currentFilter = 'ALL';
    let currentChildTimeframe = 'ALL';

    function init() {
      const storedToken = sessionStorage.getItem('child_token');
      if (storedToken) {
        loadChildData(storedToken);
        return;
      }

      const select = document.getElementById('childNameSelect');
      select.innerHTML = '<option value="">Loading names...</option>';

      fetch(`${SCRIPT_URL}?format=json&action=getChildrenList`, {
        method: "GET",
        mode: "cors",
        redirect: "follow"
      })
      .then(res => {
        if (!res.ok) throw new Error("HTTP error " + res.status);
        return res.json();
      })
      .then(data => {
        if (data.error) throw new Error(data.error);
        if (data.currency) activeCurrency = data.currency;

        if (!data.children || data.children.length === 0) {
          select.innerHTML = '<option value="">No children found</option>';
          return;
        }

        select.innerHTML = '<option value="">-- Choose Name --</option>';
        data.children.forEach(c => {
          select.innerHTML += `<option value="${c.name}">${c.name}</option>`;
        });
      })
      .catch(err => {
        console.error("Fetch failed:", err);
        select.innerHTML = '<option value="">Error loading names</option>';
        alert("Could not load names: " + err.message);
      });
    }

    function attemptLogin() {
      const name = document.getElementById('childNameSelect').value;
      const pin = document.getElementById('pinInput').value;
      if (!name || !pin) return alert('Select your name and enter your PIN.');

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'childLogin', childName: name, pin: pin })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          sessionStorage.setItem('child_token', res.token);
          document.getElementById('loginCard').style.display = 'none';
          loadChildData(res.token);
        } else {
          alert(res.error || 'Incorrect PIN');
          document.getElementById('pinInput').value = '';
        }
      })
      .catch(err => alert("Login Error: " + err.message));
    }

    function loadChildData(token) {
      fetch(`${SCRIPT_URL}?format=json&childToken=${encodeURIComponent(token)}`, {
        method: "GET",
        mode: "cors",
        redirect: "follow"
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          logout();
          return;
        }
        if (data.currency) activeCurrency = data.currency;
        rawHistory = data.history || [];

        document.querySelectorAll('.currencySymbol').forEach(el => el.innerText = activeCurrency);
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        document.getElementById('childGreeting').innerText = `${data.name}'s Savings`;
        document.getElementById('balanceDisplay').innerText = activeCurrency + Number(data.balance).toFixed(0);

        // Denied Feedback
        const deniedBox = document.getElementById('deniedSection');
        const deniedList = document.getElementById('deniedList');
        deniedList.innerHTML = '';
        if (data.deniedChores && data.deniedChores.length > 0) {
          deniedBox.style.display = 'block';
          data.deniedChores.slice(0, 2).forEach(d => {
            deniedList.innerHTML += `<div style="margin-top:4px;"><strong>${d.title}</strong>: "${d.reason}"</div>`;
          });
        } else {
          deniedBox.style.display = 'none';
        }

        // Chores catalog
        const choreSel = document.getElementById('choreSelect');
        choreSel.innerHTML = '';
        if (!data.chores || data.chores.length === 0) {
          choreSel.innerHTML = '<option value="">No chores available</option>';
        } else {
          data.chores.forEach(c => {
            choreSel.innerHTML += `<option value="${c.id}">${c.title} (+${activeCurrency}${Number(c.reward).toFixed(0)})</option>`;
          });
        }

        renderChildAnalytics();
        renderTransactions();
      })
      .catch(err => alert("Data Load Error: " + err.message));
    }

    function setChildTimeframe(btn, tf) {
      document.querySelectorAll('.slicer').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      currentChildTimeframe = tf;
      renderChildAnalytics();
    }

    function renderChildAnalytics() {
      const now = new Date();
      let startTime = 0;

      if (currentChildTimeframe === 'WEEK') {
        const startOfWeek = new Date(now);
        startOfWeek.setDate(now.getDate() - now.getDay());
        startOfWeek.setHours(0, 0, 0, 0);
        startTime = startOfWeek.getTime();
      } else if (currentChildTimeframe === 'MONTH') {
        startTime = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
      } else if (currentChildTimeframe === 'YEAR') {
        startTime = new Date(now.getFullYear(), 0, 1).getTime();
      }

      let choreSum = 0;
      let rewardSum = 0;
      let penaltySum = 0;
      let spendSum = 0;

      rawHistory.forEach(tx => {
        const txTime = tx.timestamp || new Date(tx.date).getTime();
        if (txTime >= startTime) {
          const type = String(tx.type).toLowerCase();
          const amt = Math.abs(tx.amount);

          if (type === 'chore') choreSum += amt;
          else if (type === 'reward' || type === 'special reward') rewardSum += amt;
          else if (type === 'penalty') penaltySum += amt;
          else if (type === 'expense') spendSum += amt;
        }
      });

      document.getElementById('kidChoreStat').innerText = activeCurrency + choreSum.toFixed(0);
      document.getElementById('kidRewardStat').innerText = activeCurrency + rewardSum.toFixed(0);
      document.getElementById('kidPenaltyStat').innerText = activeCurrency + penaltySum.toFixed(0);
      document.getElementById('kidSpentStat').innerText = activeCurrency + spendSum.toFixed(0);
    }

    function setTxFilter(btn, filterType) {
      document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = filterType;
      renderTransactions();
    }

    function renderTransactions() {
      const tbody = document.getElementById('txBody');
      tbody.innerHTML = '';

      const filtered = rawHistory.filter(tx => {
        if (currentFilter === 'ALL') return true;
        return String(tx.type).toLowerCase() === currentFilter.toLowerCase();
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#a0aec0; padding:16px;">No transactions found.</td></tr>';
        return;
      }

      filtered.forEach(tx => {
        const isPos = tx.amount >= 0;
        let badgeClass = 'type-expense';
        if (tx.type === 'Chore') badgeClass = 'type-chore';
        else if (tx.type === 'Reward') badgeClass = 'type-reward';
        else if (tx.type === 'Penalty') badgeClass = 'type-penalty';
        else if (tx.type === 'Allowance') badgeClass = 'type-allowance';

        tbody.innerHTML += `<tr>
          <td>
            <span class="type-badge ${badgeClass}">${tx.type}</span>
            <strong>${tx.desc}</strong>
            <div style="font-size:0.75rem; color:#a0aec0; margin-top:2px;">${tx.date}</div>
          </td>
          <td style="text-align:right;" class="${isPos ? 'pos' : 'neg'}">
            ${isPos ? '+' : ''}${activeCurrency}${Math.abs(tx.amount).toFixed(0)}
          </td>
        </tr>`;
      });
    }

    function claimChore() {
      const token = sessionStorage.getItem('child_token');
      const choreId = document.getElementById('choreSelect').value;
      if (!choreId) return alert('Select a chore to claim.');

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'submitChore', token: token, choreId: choreId })
      })
      .then(res => res.json())
      .then(res => {
        if (res.error) throw new Error(res.error);
        alert('Sent for parent approval!');
      })
      .catch(err => alert("Chore submission error: " + err.message));
    }

    function logSpending() {
      const token = sessionStorage.getItem('child_token');
      const amount = document.getElementById('spendAmt').value;
      const desc = document.getElementById('spendDesc').value;
      if (!amount || !desc) return alert('Enter amount and item name');

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'submitExpense', token: token, amount: amount, desc: desc })
      })
      .then(res => res.json())
      .then(res => {
        if (res.error) throw new Error(res.error);
        document.getElementById('spendAmt').value = '';
        document.getElementById('spendDesc').value = '';
        loadChildData(token);
      })
      .catch(err => alert("Expense error: " + err.message));
    }

    function logout() {
      sessionStorage.removeItem('child_token');
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('pinInput').value = '';
      init();
    }

    init();
  </script>
</body>
</html>
